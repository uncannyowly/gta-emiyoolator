# GTA-eMiYoolator settings (replaces GTA Settings.exe). Paths are relative
# to this folder unless they start with /.

exe = WINO/Grand Theft Auto.exe
gtadata = GTADATA
# the music the GTA1 port already has on the card (not copied again)
music = /mnt/SDCARD/Roms/PORTS/Games/GTA1/Music

# sound: mixed by gtashell, played by the native helper gtaaudio (MI_AO)
audio = 1
audio_cmd = ./gtaaudio

video = fbdev
rotate = 180
input = evdev
log = gtashell.log
# stats = 1 logs DirectDraw calls every 3 s; trace = 1 logs every Windows call worth noting

# game language: 0 English, 1 French, 2 German, 3 Italian
language = 0

# The game's ten controls (GTA Settings "Default Keys"), as PC scan codes:
# 0 turn left, 1 turn right, 2 forwards, 3 backwards, 4 brake, 5 enter/exit
# vehicle, 6 attack, 7 next weapon, 8 previous weapon, 9 special
control0 = 0xCB
control1 = 0xCD
control2 = 0xC8
control3 = 0xD0
control4 = 0x39
control5 = 0x1C
control6 = 0x1D
control7 = 0x2D
control8 = 0x2C
control9 = 0x0F

# On foot the D-pad walks the way you press: the shell turns your character
# with the game's own turn keys, then walks. 0 = original "rotate" controls.
direct = 1
direct_tolerance = 24

# Match the other port in cars: A accelerates, B brakes/reverses,
# X handbrakes, Y enters/exits, L2 uses the original Special (horn/RC action).
# The D-pad also keeps Up/Down throttle/reverse and Left/Right steering.
# Set car_buttons = 0 to restore the old layout. Optional overrides below
# are PC scan codes; omit them to follow the game's configured controls.
car_buttons = 1
# a_car = 0x148
# b_car = 0x150
# x_car = 0x39
# l2_car = 0x0F

# Miyoo buttons -> PC scan codes (0x100 = arrow/extended keys).
# START: original pause/level-info screen during play; Enter in the front end.
# SELECT: city overview (SELECT again closes it). MENU + SELECT: Esc.
# MENU alone is left to Onion. M is the desktop map key.
menu_controls = 1
start_menu = 0x1C
map_key = 0x32
escape = 0x01
up = 0x148
down = 0x150
left = 0x14B
right = 0x14D
a = 0x1D
b = 0x39
x = 0x0F
y = 0x1C
l1 = 0x2C
r1 = 0x2D
l2 = 0x19
r2 = 0x153
start = 0x40
select = 0
menu = 0
