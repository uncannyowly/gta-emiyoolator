# GTA-eMiYoolator settings (replaces GTA Settings.exe). Paths are relative
# to this folder unless they start with /.

exe = WINO/Grand Theft Auto.exe
gtadata = GTADATA
# the music the GTA1 port already has on the card (not copied again)
music = /mnt/SDCARD/Roms/PORTS/Games/GTA1/Music

# sound: mixed by gtashell, played by the native helper gtaaudio (MI_AO)
audio = 1
audio_cmd = ./gtaaudio

video = fbdev
rotate = 180
input = evdev
log = gtashell.log
# stats = 1 logs DirectDraw calls every 3 s; trace = 1 logs every Windows call worth noting

# game language: 0 English, 1 French, 2 German, 3 Italian
language = 0

# The game's ten controls (GTA Settings "Default Keys"), as PC scan codes:
# 0 turn left, 1 turn right, 2 forwards, 3 backwards, 4 brake, 5 enter/exit
# vehicle, 6 attack, 7 next weapon, 8 previous weapon, 9 special
control0 = 0xCB
control1 = 0xCD
control2 = 0xC8
control3 = 0xD0
control4 = 0x39
control5 = 0x1C
control6 = 0x1D
control7 = 0x2D
control8 = 0x2C
control9 = 0x0F

# On foot the D-pad walks the way you press: the shell turns your character
# with the game's own turn keys, then walks. 0 = original "rotate" controls.
direct = 1
direct_tolerance = 24

# Miyoo buttons -> PC scan codes (0x100 = arrow/extended keys).
# Hold MENU + START to quit.
up = 0x148
down = 0x150
left = 0x14B
right = 0x14D
a = 0x1D
b = 0x39
x = 0x0F
y = 0x1C
l1 = 0x2C
r1 = 0x2D
l2 = 0x19
r2 = 0x153
start = 0x1C
select = 0x01
menu = 0x01
